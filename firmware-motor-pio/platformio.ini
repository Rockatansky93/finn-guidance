; FINN Guidance — ESP32 Motor Controller
; PlatformIO configuration
;
; Setup:   Install PlatformIO CLI or VS Code extension
; Build:   pio run
; Flash:   pio run --target upload
; Monitor: pio device monitor
;
; Plug in ONLY the motor controller ESP32 before flashing.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
