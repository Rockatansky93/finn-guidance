[package]
name = "finn-guidance-pc"
version = "0.1.0"
edition = "2021"
description = "FINN Guidance PC application - GPS, guidance display, and steering control"

[dependencies]
finn-guidance-common = { path = "../common" }

# GPS - enable GGA and VTG sentence parsing
nmea = { version = "0.7", features = ["GGA", "VTG", "RMC", "GSA", "GSV", "GLL"] }
serialport = "4.0"

# GUI
eframe = "0.29"
egui = "0.29"

# Async / threading
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"

# Serialisation
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = "0.4"

# Coverage database
rusqlite = { version = "0.31", features = ["bundled"] }
