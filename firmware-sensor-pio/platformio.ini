; FINN Guidance — ESP32 Sensor Module
; PlatformIO configuration
;
; Setup:   Install PlatformIO CLI or VS Code extension
; Build:   pio run
; Flash:   pio run --target upload
; Monitor: pio device monitor
;
; Plug in ONLY the sensor ESP32 before flashing.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
